<svg width="680" height="130" viewBox="0 0 680 130" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg {
      fill: #000000;
      stroke: #4d0000;
      stroke-width: 2;
    }
    .pixel-text {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 1.5px;
      fill: #ff2a2a;
    }
    .reveal-1 {
      animation: typeLine1 2.4s steps(32, end) forwards;
    }
    .reveal-2 {
      animation: typeLine2 1.3s steps(15, end) 2.8s forwards;
    }
    .prompt-2 {
      opacity: 0;
      animation: showPrompt 0.1s linear 2.75s forwards;
    }
    .cursor {
      fill: #ff2a2a;
      opacity: 0;
      animation: showPrompt 0.1s linear 4.1s forwards, blink 0.8s steps(1, end) 4.1s infinite;
    }

    @keyframes typeLine1 {
      from { width: 0; }
      to { width: 520px; }
    }
    @keyframes typeLine2 {
      from { width: 0; }
      to { width: 260px; }
    }
    @keyframes showPrompt {
      to { opacity: 1; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <defs>
    <clipPath id="clip1">
      <rect x="48" y="20" width="0" height="40" class="reveal-1" />
    </clipPath>
    <clipPath id="clip2">
      <rect x="48" y="68" width="0" height="40" class="reveal-2" />
    </clipPath>
  </defs>

  <!-- Fundo preto -->
  <rect x="1" y="1" width="678" height="128" rx="8" class="bg" />

  <!-- Linha 1: Vermelho -->
  <text x="26" y="48" class="pixel-text">></text>
  <text x="48" y="48" class="pixel-text" clip-path="url(#clip1)">Olá meu nome é Pedro Henrique...</text>

  <!-- Linha 2: Vermelho -->
  <text x="26" y="96" class="pixel-text prompt-2">></text>
  <text x="48" y="96" class="pixel-text" clip-path="url(#clip2)">Seja bem vindo!</text>

  <!-- Cursor pixelado piscando -->
  <rect x="275" y="77" width="12" height="22" class="cursor" />
</svg>