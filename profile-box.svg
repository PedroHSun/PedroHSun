<svg width="720" height="264" viewBox="0 0 720 264" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 1.5px;
      fill: #39FF14;
    }
    .key-green {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 14px;
      fill: #39FF14;
    }
    .key-purple {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 14px;
      fill: #9D4EDD;
    }
    .val {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 14px;
      fill: #F0F6FC;
    }
    .cursor {
      fill: #39FF14;
      animation: blink 0.9s steps(1, end) infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <!-- Fundo preto preenchido até os cantos pixelados -->
  <g>
    <rect x="16" y="8" width="688" height="248" fill="#000000" />
    <rect x="12" y="12" width="696" height="240" fill="#000000" />
    <rect x="8" y="16" width="704" height="232" fill="#000000" />

    <!-- Borda externa pixelada em Verde Fluorescente (#39FF14) -->
    <rect x="16" y="4" width="688" height="4" fill="#39FF14" />
    <rect x="12" y="8" width="4" height="4" fill="#39FF14" />
    <rect x="8" y="12" width="4" height="4" fill="#39FF14" />
    <rect x="4" y="16" width="4" height="232" fill="#39FF14" />
    <rect x="8" y="248" width="4" height="4" fill="#39FF14" />
    <rect x="12" y="252" width="4" height="4" fill="#39FF14" />
    <rect x="16" y="256" width="688" height="4" fill="#39FF14" />
    <rect x="704" y="252" width="4" height="4" fill="#39FF14" />
    <rect x="708" y="248" width="4" height="4" fill="#39FF14" />
    <rect x="712" y="16" width="4" height="232" fill="#39FF14" />
    <rect x="708" y="12" width="4" height="4" fill="#39FF14" />
    <rect x="704" y="8" width="4" height="4" fill="#39FF14" />

    <!-- Borda interna pixelada em Roxo (#8A2BE2) -->
    <rect x="20" y="12" width="680" height="2" fill="#8A2BE2" />
    <rect x="14" y="18" width="2" height="228" fill="#8A2BE2" />
    <rect x="20" y="250" width="680" height="2" fill="#8A2BE2" />
    <rect x="704" y="18" width="2" height="228" fill="#8A2BE2" />

    <!-- Barra superior estilo janela retrô -->
    <rect x="16" y="44" width="688" height="4" fill="#8A2BE2" />
    <rect x="644" y="22" width="12" height="12" fill="#8A2BE2" />
    <rect x="664" y="22" width="12" height="12" fill="#8A2BE2" />
    <rect x="684" y="22" width="12" height="12" fill="#39FF14" />

    <!-- Marcadores pixelados de cada linha -->
    <rect x="28" y="69" width="8" height="8" fill="#39FF14" />
    <rect x="28" y="99" width="8" height="8" fill="#9D4EDD" />
    <rect x="28" y="129" width="8" height="8" fill="#39FF14" />
    <rect x="28" y="159" width="8" height="8" fill="#9D4EDD" />
    <rect x="28" y="189" width="8" height="8" fill="#39FF14" />
    <rect x="28" y="219" width="8" height="8" fill="#9D4EDD" />
  </g>

  <!-- Título da janela -->
  <text x="28" y="33" class="title">> PLAYER_PROFILE.exe</text>

  <!-- Dados alinhados por coluna -->
  <text y="77">
    <tspan x="46" class="key-green">NOME...............:</tspan>
    <tspan x="224" class="val">Pedro Henrique</tspan>
  </text>

  <text y="107">
    <tspan x="46" class="key-purple">CLASSE.............:</tspan>
    <tspan x="224" class="val">Desenvolvedor</tspan>
  </text>

  <text y="137">
    <tspan x="46" class="key-green">LOCALIZAÇÃO........:</tspan>
    <tspan x="224" class="val">Salvador, Bahia - Brasil</tspan>
  </text>

  <text y="167">
    <tspan x="46" class="key-purple">MISSÃO ATUAL.......:</tspan>
    <tspan x="224" class="val">Evoluir como dev e construir projetos incríveis</tspan>
  </text>

  <text y="197">
    <tspan x="46" class="key-green">MISSÕES SECUNDÁRIAS:</tspan>
    <tspan x="224" class="val">Participar de Hackathons</tspan>
  </text>

  <text y="227">
    <tspan x="46" class="key-purple">ARMA FAVORITA......:</tspan>
    <tspan x="224" class="val">Uma xícara de cafézinho</tspan>
  </text>

  <!-- Cursor pixelado piscando -->
  <rect x="684" y="216" width="10" height="16" class="cursor" />
</svg>
